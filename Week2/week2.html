<!DOCTYPE html>
<html lang="eng">
    <head>
        <title>week 2 cookie clicker</title>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <style>
            @font-face {
                font-family: fancy;
                src: url(fonts/Milesdane\ Trial.otf);
            }
            body{
                 background-color: brown;
            }
            #container{
                width: 100%;
                text-align: center;
            }
            #output{
                font-family: "fancy";
                color: royalblue;
                background-color: bisque;
                font-size: 60px;
                width: 100px;
                margin-left: auto;
                margin-right: auto;
                border: 3px solid green;
            }
            h1, h2{
                font-family: "fancy";
                font-weight: normal;
                color: aqua;
            }

            #btn:hover{
                transform: scale(1.05);
            }
            #btn:active{
                transform: scale(0.9);
            }
        </style>
    </head>
    <body>
        <div id="container">
            <h1>Clicker Game</h1>
            <span id="message"></span>
            <hr>
            <br>
            <h2>Click to go up</h2>
            <h3 id="output">0</h3>
            <button type="button" id="btn" style="background: none; border: none;">
                <img src="images Week2/bigOldButton.png" alt="Button Image" width="100">
            </button>
            <!-- <input type="button" value="I'm the hot single click" id="btn"> -->
            <input type="button" value="Reset" id="btn-reset">
        </div>
        

        <!-- Javascript stuff below -->
        <script>
            // example stuff it's commetned out
            // var name = prompt("gimme da name or the dame gets it")
            // var firstNumber = prompt("pick a number any number")
            // var secondNumber = prompt("and anotha one")
            // var value = firstNumber * secondNumber;
            // var message = `Sup ${name}.
            //     \nGet numbered:${firstNumber}
            //     \nNumber again electric boogaloo:${secondNumber}
            //     \nHeard you like numbers so i combined it: ${value}`;
            // console.log(message);
            // document.getElementById("message").innerHTML = message;
            // document.getElementById("message").style.color = "green";

            //Get in loser we're making cookie clicker

        var clickerButton = document.querySelector("#btn");
        var clearButton = document.querySelector("#btn-reset");
        var clickerOutput = document.querySelector("#output");
        var clickerSound = new Audio("audio/sansUndertale.mp3");

        var numberOfClicks = 0;

        clickerButton.addEventListener("click", function(){
            numberOfClicks++;
            updateClickerDisplay();
            clickerSound.currentTime = 0;
            clickerSound.play();

            if(numberOfClicks == 25){
                alert("Wow you're easily entertained");
            }
        });

        clearButton.addEventListener("click", function(){
            numberOfClicks = 0;
            clickerOutput.innerHTML = numberOfClicks;
        });

        function updateClickerDisplay(){
            clickerOutput.innerHTML = numberOfClicks;
        }
        </script>
    </body>
</html>
